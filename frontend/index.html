<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070B14" />
    <meta name="description" content="Launch Crew — build, automate and launch AI-powered products from one workspace." />
    <title>Launch Crew — Build. Automate. Launch.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // apply the saved theme before first paint (no flash)
      (function () {
        try {
          var t = localStorage.getItem("lc_theme") || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2306B6D4'/><stop offset='.4' stop-color='%230891B2'/><stop offset='.75' stop-color='%236366F1'/><stop offset='1' stop-color='%238B5CF6'/></linearGradient></defs><rect width='40' height='40' rx='9' fill='%23070B14'/><path d='M15 9 V25 H27' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/><ellipse cx='20' cy='25' rx='13' ry='5' fill='none' stroke='url(%23g)' stroke-width='2' transform='rotate(-18 20 25)' opacity='.85'/><path d='M28.5 8.5c2 0 3.2 1.5 3.2 3.6l-1.3 3.4-3.9-1.1z' fill='url(%23g)'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app crashes before React starts (e.g. a broken import), show the error instead of a blank page.
      (function () {
        var box;
        function show(msg) {
          var root = document.getElementById("root");
          if (root && root.children.length) return;
          if (!box) {
            box = document.createElement("div");
            box.setAttribute("style", "font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:20px;border:2px solid #b91c1c;border-radius:12px;color:#7f1d1d;background:#fef2f2");
            document.body.appendChild(box);
          }
          box.textContent = "The app failed to start. Open DevTools (F12) > Console and send the first red error. Details: " + msg;
        }
        window.addEventListener("error", function (e) { show(e.message || "script error"); });
        window.addEventListener("unhandledrejection", function (e) { show(String(e.reason)); });
        setTimeout(function () { show("nothing rendered after 4 seconds"); }, 4000);
        setInterval(function () {
          var root = document.getElementById("root");
          if (box && root && root.children.length) { box.remove(); box = null; }
        }, 500);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
